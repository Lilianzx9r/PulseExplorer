# Mémoire réduite pour JVM 32 bits (jre1.8 dans Program Files x86)
org.gradle.jvmargs=-Xmx1g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError

# Désactiver Jetifier — inutile avec Flutter moderne et AndroidX natif
android.useAndroidX=true
android.enableJetifier=false

# Parallélisme et cache
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
