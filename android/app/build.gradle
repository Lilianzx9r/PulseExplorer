plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.pulsegpx.app"
    compileSdk 36
    ndkVersion "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        applicationId "com.pulsegpx.app"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            // shrinkResources géré par le plugin Flutter
        }
        debug {
            minifyEnabled false
        }
    }
}

flutter {
    source '../..'
}

// Force shrinkResources false même si le plugin Flutter l'active
android.buildTypes.all { buildType ->
    buildType.shrinkResources = false
}
