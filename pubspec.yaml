name: pulse_explorer
description: PulseExplorer — gestion de POI/GPX et navigation GPS (refonte de PulseGPX)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.4.2
  webview_flutter_android: ^3.12.1
  url_launcher: ^6.2.5
  file_picker: ^8.0.0
  xml: ^6.3.0
  http: ^1.1.0
  path_provider: ^2.1.1
  permission_handler: ^11.3.0
  flutter_map: ^7.0.2
  vector_map_tiles: ^8.0.0
  vector_map_tiles_pmtiles: ^1.5.0
  latlong2: ^0.9.1
  archive: ^3.4.10
  window_manager: ^0.3.9
  geolocator: ^13.0.2
  flutter_compass: ^0.8.0
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true